<style>
:root{
  --ink:#1d1a3a; --panel:#fffdf4; --panel-ink:#1d1a3a; --muted:#5b5680; --scrim:rgba(29,26,58,.38);
  --hud-bg:rgba(255,255,255,.9); --chip-bg:#ffffff;
  --p1:#2f7bff; --p2:#ff3b5c; --gold:#ffc629; --leaf:#2fbf5f; --stone:#8a88a8; --grape:#8a4fd8;
  --page-bg:#cdeeff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#26224d; --panel-ink:#ffffff; --muted:#cbc6f2; --scrim:rgba(0,0,0,.5); --hud-bg:rgba(38,34,77,.92); --chip-bg:#3a3570; }
}
:root[data-theme="dark"]{ --panel:#26224d; --panel-ink:#ffffff; --muted:#cbc6f2; --scrim:rgba(0,0,0,.5); --hud-bg:rgba(38,34,77,.92); --chip-bg:#3a3570; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--page-bg);}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;height:100%;overflow:hidden;position:relative;background:var(--page-bg);color:var(--panel-ink);
  font-family:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible{outline:3px solid var(--p1);outline-offset:3px;}
.lg{font-family:"Luckiest Guy","Arial Black",Impact,sans-serif;font-weight:400;letter-spacing:.5px;}
.hidden{display:none!important;}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;}

/* HUD */

/* ================= saved progress ================= */
const Progress={
  data:{freed:[],resetAt:0}, ref:null, chain:Promise.resolve(),
  load(){ const d=store.get('fb_progress',null); if(d&&Array.isArray(d.freed)) this.data={freed:d.freed.filter(id=>STORY_IDS.includes(id)),resetAt:+d.resetAt||0}; },
  saveLocal(){ store.set('fb_progress',this.data); },
  isUnlocked(id){ return !!CHARS[id]; },
  free(id){ if(!this.data.freed.includes(id)){ this.data.freed.push(id); this.saveLocal(); this.push(); } },
  reset(){ this.data={freed:[],resetAt:Date.now()}; this.saveLocal(); this.push(); },
  push(){
    if(!this.ref) return;
    const ref=this.ref, body={freed:this.data.freed.slice(),resetAt:this.data.resetAt,updated:Date.now()};
    this.chain=this.chain.then(()=>ref.set(body)).catch(()=>{});
  },
  merge(r){
    const rf=Array.isArray(r.freed)?r.freed.filter(id=>STORY_IDS.includes(id)):[], rr=+r.resetAt||0;
    let pushBack=false;
    if(rr>this.data.resetAt){ this.data={freed:rf,resetAt:rr}; }
    else if(rr<this.data.resetAt){ pushBack=true; }
    else { const u=Array.from(new Set(this.data.freed.concat(rf))); if(u.length!==rf.length) pushBack=true; this.data.freed=u; }
    this.saveLocal(); if(pushBack) this.push();
  },
  async connect(){
    try{
      if(!window.claude||typeof window.claude.use!=='function') return;
      const db=await window.claude.use('db'); if(!db) return;
      this.ref=db.doc('progress/family');
      const snap=await this.ref.get();
      if(snap.exists) this.merge(snap.data()||{});
      else if(this.data.freed.length||this.data.resetAt) this.push();
      onProgressSynced();
    }catch(e){ this.ref=null; }
  }
};
function nextStory(){ return STORY_IDS.find(id=>!Progress.data.freed.includes(id))||null; }

        this.ac=new AC();
        this.master=this.ac.createGain(); this.master.gain.value=this.muted?0:.9; this.master.connect(this.ac.destination);
        const b=this.ac.createBuffer(1,this.ac.sampleRate,this.ac.sampleRate), d=b.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
        this.noiseBuf=b;
      }
      if(this.ac.state==='suspended') this.ac.resume();
    }catch(e){}
  },

  tone(f1,f2,dur,type,vol,delay){
    if(!this.ac||this.muted) return;
    try{
      const t=this.ac.currentTime+(delay||0), o=this.ac.createOscillator(), g=this.ac.createGain();
      o.type=type||'square'; o.frequency.setValueAtTime(f1,t);

      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.1,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+.03);
    }catch(e){}
  },
  noise(dur,vol,freq,delay,type){
    if(!this.ac||this.muted||!this.noiseBuf) return;

      const t=this.ac.currentTime+(delay||0), s=this.ac.createBufferSource(); s.buffer=this.noiseBuf;

      const g=this.ac.createGain(); g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t,Math.random()*.5); s.stop(t+dur+.03);

/* ================= canvas sizing ================= */
const canvas=$('#game'), ctx=canvas.getContext('2d');
const skyLayer=document.createElement('canvas'), skyCtx=skyLayer.getContext('2d');
const stageLayer=document.createElement('canvas'), stageCtx=stageLayer.getContext('2d');
let DPR=1,CW=1,CH=1,SCALE=1,OX=0,OY=0;
function resize(){
  const r=document.body.getBoundingClientRect();
  CW=Math.max(1,Math.round(r.width)); CH=Math.max(1,Math.round(r.height));
  DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(CW*DPR); canvas.height=Math.round(CH*DPR);
  if(CW>=CH){ SCALE=Math.min(CW/W,CH/H); OX=(CW-W*SCALE)/2; OY=(CH-H*SCALE)/2; }
  else { SCALE=Math.min(CW/760,CH/H); OX=(CW-W*SCALE)/2; OY=Math.max(64,CH*.4-H*SCALE/2); }
  for(const l of [skyLayer,stageLayer]){ l.width=canvas.width; l.height=canvas.height; }
  paintSky(); paintStage();
}
function worldTf(c,sx,sy){ c.setTransform(DPR*SCALE,0,0,DPR*SCALE,DPR*(OX+(sx||0)),DPR*(OY+(sy||0))); }
function viewRange(){ return {x1:-OX/SCALE-60,x2:(CW-OX)/SCALE+60,y1:-OY/SCALE-60,y2:(CH-OY)/SCALE+60}; }

/* ================= drawing primitives ================= */
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function fs(c,fill,lw){ c.fillStyle=fill; c.fill(); if(lw){ c.lineWidth=lw; c.strokeStyle=OUT; c.stroke(); } }
function capsule(c,x1,y1,x2,y2,w,col){
  c.lineCap='round'; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2);
  c.strokeStyle=OUT; c.lineWidth=w+5; c.stroke();

function basePose(){ return {hip:1,lean:0,armB:.25,armF:.4,armBk:1,armFk:1,legB:-.08,legF:.08,legBk:1,legFk:1,headBob:0,fistB:false,fistF:false,face:'normal',rot:0,sx:1,sy:1,bigHands:0,lie:false,oy:0,reach:0,glow:false}; }

  const p=basePose(), s=f.state;

    else if(Math.abs(f.vx)>25){ const ph=f.walkPhase, sn=Math.sin(ph); p.legB=sn*.65; p.legF=-sn*.65; p.armB=-sn*.8+.1; p.armF=sn*.8+.2; p.headBob=-Math.abs(Math.cos(ph))*2.5; p.lean=.07; }
    else { const b=Math.sin(t*3.2+f.side*1.7); p.headBob=b*1.2; p.armB=.35+b*.06; p.armF=.6-b*.06; p.fistB=p.fistF=true; p.legB=-.14; p.legF=.14; }
  } else if(s==='attack'&&f.atk){

function dogPose(f,t){

  } else if(s==='attack'&&f.atk){
    const a=f.atk, k=a.t, wind=k<a.on, act=k>=a.on&&k<=a.off; p.face='yell';
    switch(a.type){

      case 'kick': if(wind){ p.bn=p.bf=-.5; p.tilt=.1; } else if(act){ p.bn=-1.45; p.bf=-1.3; p.bnk=1.15; p.bfk=1.1; p.tilt=.28; p.headY=6; p.mouth=.5; } else p.bn=p.bf=-.6; break;

      case 'jpunch': p.fn=p.ff=act?1.2:.8; p.bn=p.bf=-.6; p.tilt=.2; p.mouth=.9; break;

  return p;
}

function updFx(dt){
  for(const p of G.particles){ p.life-=dt; p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; if(p.type==='confetti') p.vx*=.99; }

function projGround(p,py){

function updProjectiles(dt,canHit){
  for(const p of G.proj){
    p.t+=dt; p.life-=dt;
    if(p.ax) p.vx+=p.ax*dt;
    if(p.g) p.vy+=p.g*dt;
    if(p.vr) p.rot+=p.vr*dt;
    const py=p.y; p.x+=p.vx*dt; p.y+=p.vy*dt;
    switch(p.kind){
      case 'wave':
        if(p.plat&&(p.x<p.plat.x1-10||p.x>p.plat.x2+10)){ p.plat=null; p.g=1600; }
        if(Math.random()<.5) spawn({x:p.x-Math.sign(p.vx)*rnd(0,20),y:p.y-rnd(20,58),vx:-p.vx*.2+rnd(-40,40),vy:rnd(-160,-40),g:600,life:.4,size:rnd(2,4),color:pick(['#ffffff','#bfefff'])});
        break;
      case 'scoop': { const pl=projGround(p,py); if(pl){ splat(p.x,pl.y); p.life=0; sfx('splat'); } } break;
      case 'bball': { const pl=projGround(p,py); if(pl){ p.y=pl.y-p.r; p.vy=-Math.abs(p.vy)*.62; p.bounces++; sfx('bounce'); if(p.bounces>2) p.life=Math.min(p.life,.35); } } break;
      case 'fire': case 'volley':
        if(Math.random()<.8) spawn({x:p.x-Math.sign(p.vx||1)*rnd(4,14),y:p.y+rnd(-6,6),vx:-p.vx*.1,vy:rnd(-60,-10),life:.3,size:rnd(3,6),color:pick(['#ffd84d','#ff8a3d','#ff5a2d'])});
        if(p.kind==='volley'){ const pl=projGround(p,py); if(pl){ p.life=0; dust(p.x,pl.y,6); } }
        break;
      case 'cane': {
        const o=p.owner;
        p.rot+=dt*18*p.dir;
        if(Math.abs(p.vx)>800) p.vx=Math.sign(p.vx)*800;
        if(!p.back&&Math.sign(p.vx)===-p.dir){ p.back=true; p.hits.clear(); }
        if(p.back&&o){ p.y=approach(p.y,o.y-o.H*.55,320*dt); if(Math.abs(p.x-o.x)<o.halfW+16) p.life=0; }
        if(!o||!isUp(o)) p.life=0;
      } break;
      case 'brick': { const pl=projGround(p,py); if(pl){ p.life=0; brickBits(p.x,pl.y,p.color); sfx('clack'); } } break;
      case 'boulder': { const pl=projGround(p,py); if(pl){ p.life=0; dust(p.x,pl.y,14); G.shake=Math.max(G.shake,7); sfx('thud'); } } break;
    }
    if(p.life>0&&canHit){
      const b=projBox(p);
      for(const f of G.fighters){
        if(f.team===p.team||p.hits.has(f)||!f.canBeHit()) continue;
        const hr=f.hurtbox();
        if(b.x1<hr.x2&&b.x2>hr.x1&&b.y1<hr.y2&&b.y2>hr.y1){
          p.hits.add(f);
          f.takeHit({dmg:p.dmg,kb:p.kb,kind:p.hitKind},{x:p.x-Math.sign(p.vx||1)*30});
          if(p.burn) f.setBurn();
          const cx=(Math.max(b.x1,hr.x1)+Math.min(b.x2,hr.x2))/2, cy=(Math.max(b.y1,hr.y1)+Math.min(b.y2,hr.y2))/2;
          if(p.kind==='scoop') splat(cx,cy); else if(p.kind==='brick') brickBits(cx,cy,p.color); else hitBurst(cx,cy,p.big);
          pop(pick(p.words),cx,cy-30,p.col,p.big?42:32);
          G.shake=Math.max(G.shake,p.big?9:3); G.hitstop=p.big?.08:.04; sfx(p.snd);
          if(p.once){ p.life=0; break; }
        }

    }
    if(p.x<-400||p.x>1400||p.y>760) p.life=0;
  }
  for(const p of G.proj) if(p.life<=0&&p.kind==='cane'&&p.owner) p.owner.caneOut=false;
  G.proj=G.proj.filter(p=>p.life>0);
}
function drawProjectiles(c,t){

        c.beginPath(); c.moveTo(-10,-46); c.quadraticCurveTo(2,-56,14,-52); c.stroke();

        c.restore(); break;
      case 'bball': drawBall(c,p.x,p.y,1.05,p.rot); break;

        c.fillStyle='#ff8a3d'; c.fill(); c.lineWidth=2.5; c.strokeStyle=OUT; c.stroke();
        c.beginPath(); c.arc(4,0,7,0,Math.PI*2); c.fillStyle='#ffd84d'; c.fill();
        c.restore();
      } break;
      case 'cane':
        c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.lineCap='round';
        for(const pass of [[7,OUT],[4,'#7a4a26']]){ c.strokeStyle=pass[1]; c.lineWidth=pass[0]; c.beginPath(); c.moveTo(-20,0); c.lineTo(18,0); c.stroke(); c.beginPath(); c.arc(-20,-5,5,Math.PI/2,Math.PI*1.5,true); c.stroke(); }
        c.fillStyle='#d9dde6'; c.beginPath(); c.arc(8,0,2.4,0,Math.PI*2); c.fill();
        c.restore(); break;
      case 'brick': c.save(); c.translate(p.x,p.y); c.rotate(p.rot); drawBrick(c,0,0,p.color); c.restore(); break;
      case 'boulder': c.save(); c.translate(p.x,p.y); c.rotate(p.rot); drawBoulder(c,0,0,p.r); c.restore(); break;
    }
  }
}

      }
      if(sp.type==='golf'&&sp.phase==='swing')
        return Object.assign(this.boxWorld([0,100*k,-100*k,12]),{dmg:12,kb:[900,-560],kind:'hit',snd:'smash',words:['FORE!','TURBO!'],shake:12,col:'#ffb14a',big:true,hits:sp.hits});
      if(sp.type==='buck'&&sp.phase==='kick')

  takeHit(h,att){

}

/* ================= computer player ================= */
function offStage(f){ return f.x<MAIN.x1||f.x>MAIN.x2; }
function aiWantsSpecial(me,foe,adx,dy){
  switch(me.def.special){
    case 'spin': return adx<280&&foe.onGround&&!offStage(foe);
    case 'dunk': return adx<330&&foe.onGround&&!offStage(foe);
    case 'laser': case 'mouthLaser': return Math.abs(dy)<35&&adx<650;
    case 'fart': return Math.abs(dy)<30&&adx<620;
    case 'wave': return Math.abs(dy)<14&&me.onGround&&adx>90&&adx<700;
    case 'stretch': return Math.abs(dy)<30&&adx>70&&adx<310;
    case 'mind': return adx<430&&Math.abs(dy)<200;
    case 'scoop': return adx>100&&adx<520&&dy>-140;
    case 'hoops': return adx>100&&adx<540&&dy>-140;
    case 'spike': return adx<520;
    case 'giant': return adx<420&&me.giantT<=0;
    case 'fireball': return Math.abs(dy)<40&&adx<620;
    case 'boomerang': return Math.abs(dy)<40&&adx<430&&!me.caneOut;
    case 'brick': return adx>110&&adx<500;
    case 'boulder': return adx>110&&adx<460;
    case 'buck': return adx<150&&Math.abs(dy)<60;
    case 'golf': return adx<120*me.k&&Math.abs(dy)<50;
  }
  return false;
}
function aiThink(me,foe,dt){
  const ai=me.ai, inp=ai.inp, lv=me.aiLevel;
  inp.punch=inp.kick=inp.special=false;
  if(!foe){ inp.x=0; inp.y=0; return inp; }
  if(me.burn&&me.state==='normal'){ inp.x=0; inp.y=me.onGround?-1:0; return inp; }
  if(!me.onGround&&me.state==='normal'&&(me.x<MAIN.x1+6||me.x>MAIN.x2-6||me.y>MAIN.y+5)){
    inp.x=me.x<500?1:-1;
    inp.y=(me.vy>60&&me.jumpsLeft>0&&me.y>MAIN.y-20)?-1:0;
    return inp;
  }
  ai.t-=dt; if(ai.t>0) return inp;
  ai.t=lerp(.45,.16,lv)*rnd(.6,1.4);
  inp.x=0; inp.y=0;
  if(me.state!=='normal') return inp;
  const dx=foe.x-me.x, adx=Math.abs(dx), dy=foe.y-me.y;
  const foeDown=foe.state==='knockdown'||foe.state==='grabbed'||foe.state==='lifted'||foe.invuln>.3;
  const rapid=me.def.cool<2;
  if(me.meter>=1&&!foeDown&&Math.random()<lerp(.25,.65,lv)*(rapid?.8:1)&&aiWantsSpecial(me,foe,adx,dy)){ inp.special=true; return inp; }
  const reach=(me.halfW+foe.halfW+30)*(me.def.kind==='dog'?1:Math.min(1.3,me.k));
  if(adx<reach&&Math.abs(dy)<50*me.scale&&!foeDown){
    if(Math.random()<lerp(.5,.88,lv)){
      const r=Math.random();
      if(!me.onGround){ if(r<.5) inp.punch=true; else inp.kick=true; }
      else if(me.scale>1.3){ if(r<.3) inp.punch=true; else inp.kick=true; }
      else if(r<.45) inp.punch=true;
      else if(r<.8) inp.kick=true;
      else { inp.y=1; inp.kick=true; }
    } else if(Math.random()<.4) inp.x=dx>0?-1:1;
    return inp;
  }
  let dir=dx>0?1:-1;
  if(foeDown&&adx<140) dir=0;
  if(rapid&&adx>150&&adx<480&&Math.random()<.5) dir=0;
  const ahead=me.x+dir*50;
  if(me.onGround&&me.platform&&(ahead<me.platform.x1+10||ahead>me.platform.x2-10)){
    if(me.platform.main||!(foe.y>me.y+20)) dir=0;
  }
  inp.x=dir*lerp(.72,1,lv);
  if(me.onGround&&dy<-70&&adx<220&&Math.random()<.7) inp.y=-1;
  else if(me.onGround&&Math.random()<lerp(.04,.08,lv)) inp.y=-1;
  if(me.onGround&&me.platform&&!me.platform.main&&foe.y>me.y+40&&Math.random()<.5) inp.y=1;
  return inp;
}
function demoInput(f,dt){
  f.ai.demoT-=dt;
  if(f.ai.demoT>0||f.state!=='normal'||!f.onGround) return EMPTY;
  f.ai.demoT=rnd(1.4,3.2);
  const r=Math.random();
  if(r<.3) return {x:0,y:0,punch:true,kick:false,special:false};
  if(r<.6) return {x:0,y:0,punch:false,kick:true,special:false};
  if(r<.85) return {x:0,y:-1,punch:false,kick:false,special:false};
  f.meter=1; return {x:0,y:0,punch:false,kick:false,special:true};
}

function resolveHits(att,def){
  const hb=att.activeHitbox(); if(!hb||hb.hits.has(def)||!def.canBeHit()) return;
  const hr=def.hurtbox();
  if(hb.x1<hr.x2&&hb.x2>hr.x1&&hb.y1<hr.y2&&hb.y2>hr.y1){
    hb.hits.add(def); def.takeHit(hb,att);
    const cx=(Math.max(hb.x1,hr.x1)+Math.min(hb.x2,hr.x2))/2, cy=(Math.max(hb.y1,hr.y1)+Math.min(hb.y2,hr.y2))/2;
    hitBurst(cx,cy,!!hb.big); pop(pick(hb.words),cx,cy-30,hb.col,hb.big?44:34);
    G.shake=Math.max(G.shake,hb.shake); G.hitstop=hb.big?.1:.05;
    sfx(hb.snd);
    if(hb.bounce){ att.endSpecial(); att.vy=-560; att.onGround=false; att.platform=null; att.jumpsLeft=1; }
  }
}
const NOSEP={dead:1,freeing:1,grabbed:1,lifted:1};
function separate(A,B){
  if(NOSEP[A.state]||NOSEP[B.state]) return;
  const min=(A.halfW+B.halfW)*.65, dx=B.x-A.x, dy=B.y-A.y;
  if(Math.abs(dx)<min&&Math.abs(dy)<70*Math.max(A.scale,B.scale)){ const push=(min-Math.abs(dx))/2*(dx===0?1:Math.sign(dx)); A.x-=push; B.x+=push; }
}
function cactusPoke(x,y){ for(let i=0;i<12;i++){ const a=-Math.PI*rnd(.1,.9), s=rnd(140,360); spawn({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:800,life:rnd(.3,.6),size:rnd(3,6),type:'star',color:pick(['#7dd35a','#ffffff','#ffd84d'])}); } }
function checkBounds(f,penalty){
  if(f.state==='grabbed'||f.state==='lifted') return;
  const A=ARENAS[G.arena]||ARENAS.backyard, hz=A.hazard;
  const fell=f.y>(hz==='none'?660:A.hy), outX=f.x<-260||f.x>1260;
  if(!fell&&!outX) return;
  const hurt=penalty&&isUp(f);
  if(hurt) f.hp=Math.max(0,f.hp-15);
  f.atk=null; f.sp=null; f.pendingSlam=null; f.dropThrough=null; f.jumpsLeft=1; f.onGround=false; f.platform=null;
  if(hz==='cactus'&&fell&&!outX){
    cactusPoke(f.x,A.hy-10);
    if(hurt){ pop('OUCH!',clamp(f.x,120,880),A.hy-60,'#7dd35a',42); sfx('ouch'); }
    const tx=clamp(f.x,260,740);
    f.y=A.hy; f.vy=-1250; f.vx=(tx-f.x)/1.22;
    if(isUp(f)&&f.state!=='win'){ f.setState('hitstun'); f.stun=.55; }
    f.invuln=hurt?1.4:0; G.shake=Math.max(G.shake,6);
    return;
  }
  if(hz==='lake'&&fell){ splash(clamp(f.x,-100,1100),430); if(hurt){ pop('BRRR!',clamp(f.x,120,880),400,'#bfefff',42); sfx('splash'); sfx('brr'); f.cold=2; } }
  else if(hurt){ sfx('fall'); pop('-15',clamp(f.x,140,860),300,'#ff5a4e',32); }
  if(hurt) G.shake=Math.max(G.shake,6);
  f.x=500; f.y=-60; f.vx=0; f.vy=0;
  if(isUp(f)&&f.state!=='win') f.setState('normal');
  f.invuln=hurt?1.6:0;
}
function reviveTick(dt){
  if(!G.match||!G.match.coop) return;
  for(const f of G.fighters){
    if(f.team===0&&f.state==='dead'&&f.reviveT>0){
      f.reviveT-=dt;
      if(f.reviveT<=0){ f.hp=Math.round(f.hpMax*.4); f.setState('normal'); f.invuln=1.5; pop('BACK IN!',f.x,f.y-f.H-20,'#7dffa0',32); sfx('freed'); }
    }

}
function checkEnd(){
  const F=G.fighters, m=G.match;
  for(const f of F) if(f.hp<=0&&isUp(f)) f.down(m.coop&&f.team===0);
  const heroesUp=F.some(f=>f.team===0&&isUp(f)), foesUp=F.some(f=>f.team===1&&isUp(f));
  if(!foesUp) finish(0); else if(!heroesUp) finish(1);
}
function finish(winTeam){
  const m=G.match;
  G.state='ko'; G.stateT=0; G.outcome=winTeam===0?'win':'lose'; G.winShown=false; G.proj=[];
  for(const f of G.fighters){

    else if(f.state!=='freeing'){ f.sp=null; f.invuln=0; f.burn=null; f.setState('dead'); }
  }

const controlsEl=$('#controls');
let pads=[];
function makePad(pi){
  const pad={x:0,y:0,punch:false,kick:false,special:false,sid:null,specialBtn:null};
  const stick=document.createElement('div'); stick.className='stick p'+(pi+1);
  const knob=document.createElement('div'); knob.className='knob'; stick.appendChild(knob);
  const setKnob=()=>{ knob.style.left=(50+pad.x*30)+'%'; knob.style.top=(50+pad.y*30)+'%'; };
  const move=e=>{
    const r=stick.getBoundingClientRect();
    let dx=(e.clientX-(r.left+r.width/2))/(r.width*.42), dy=(e.clientY-(r.top+r.height/2))/(r.height*.42);
    const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }
    pad.x=dx; pad.y=dy; setKnob();
  };
  stick.addEventListener('pointerdown',e=>{ e.preventDefault(); Sound.unlock(); pad.sid=e.pointerId; try{ stick.setPointerCapture(e.pointerId); }catch(_){} move(e); });
  stick.addEventListener('pointermove',e=>{ if(e.pointerId===pad.sid) move(e); });
  const end=e=>{ if(e.pointerId!==pad.sid) return; pad.sid=null; pad.x=0; pad.y=0; setKnob(); };
  for(const ev of ['pointerup','pointercancel','lostpointercapture']) stick.addEventListener(ev,end);
  const cl=document.createElement('div'); cl.className='cluster p'+(pi+1);
  const mk=(cls,ic,lb,key)=>{
    const b=document.createElement('div'); b.className='abtn '+cls; b.setAttribute('role','button'); b.setAttribute('aria-label',lb);
    b.innerHTML='<span class="ic">'+ic+'</span><span class="lb">'+lb+'</span>';
    const ids=new Set();
    b.addEventListener('pointerdown',e=>{ e.preventDefault(); Sound.unlock(); ids.add(e.pointerId); pad[key]=true; b.classList.add('on'); });
    const up=e=>{ ids.delete(e.pointerId); if(!ids.size) b.classList.remove('on'); };
    for(const ev of ['pointerup','pointercancel','pointerleave']) b.addEventListener(ev,up);
    cl.appendChild(b); return b;
  };
  mk('b-punch','👊','Punch','punch'); mk('b-kick','🦶','Kick','kick'); pad.specialBtn=mk('b-special','⭐','Special','special');
  controlsEl.append(stick,cl);
  return pad;
}
function buildControls(n){
  controlsEl.innerHTML=''; controlsEl.className=n===1?'one':'two';
  pads=[makePad(0)]; if(n===2) pads[1]=makePad(1);
}
const keys=Object.create(null);
const KM=[{l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS',p:'KeyF',k:'KeyG',s:'KeyH'},{l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',p:'KeyK',k:'KeyL',s:'Semicolon'}];
const kbPress=[{punch:false,kick:false,special:false},{punch:false,kick:false,special:false}];
const GAME_KEYS=new Set(KM.flatMap(m=>Object.values(m)));
addEventListener('keydown',e=>{
  if(e.code==='Escape'||e.code==='KeyP'){ if(G.paused) resume(); else pause(); return; }
  if(GAME_KEYS.has(e.code)) e.preventDefault();
  if(e.repeat) return;
  keys[e.code]=true; Sound.unlock();
  KM.forEach((m,i)=>{ if(e.code===m.p) kbPress[i].punch=true; if(e.code===m.k) kbPress[i].kick=true; if(e.code===m.s) kbPress[i].special=true; if(e.code===m.u) kbPress[i].up=true; });
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
function readInput(pi){
  const inp={x:0,y:0,punch:false,kick:false,special:false};
  const pad=pads[pi];
  if(pad){ inp.x=pad.x; inp.y=pad.y; inp.punch=pad.punch; inp.kick=pad.kick; inp.special=pad.special; pad.punch=pad.kick=pad.special=false; }
  const humans=G.match?G.match.players:1;
  const maps=(humans===1&&pi===0)?[0,1]:[pi];
  for(const mi of maps){
    const m=KM[mi]; if(!m) continue;
    const kx=(keys[m.r]?1:0)-(keys[m.l]?1:0), ky=(keys[m.d]?1:0)-(keys[m.u]?1:0);
    if(kx) inp.x=kx; if(ky) inp.y=ky;
    const kp=kbPress[mi];
    if(kp.punch) inp.punch=true; if(kp.kick) inp.kick=true; if(kp.special) inp.special=true; if(kp.up){ inp.y=-1; kp.up=false; }
    kp.punch=kp.kick=kp.special=false;
  }
  const gp=readGamepad(pi);
  if(gp){ if(gp.x) inp.x=gp.x; if(gp.y) inp.y=gp.y; if(gp.punch) inp.punch=true; if(gp.kick) inp.kick=true; if(gp.special) inp.special=true; if(gp.start) setTimeout(()=>{ if(G.paused) resume(); else pause(); },0); }
  return inp;
}
const gpPrev=[{},{}];
function readGamepad(slot){
  if(!navigator.getGamepads) return null;
  let list=[];
  try{ list=Array.from(navigator.getGamepads()).filter(g=>g&&g.connected); }catch(e){ return null; }
  const g=list[slot]; if(!g) return null;
  const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed);
  let x=g.axes[0]||0, y=g.axes[1]||0;
  if(Math.abs(x)<.25) x=0; if(Math.abs(y)<.25) y=0;
  if(b(14)) x=-1; if(b(15)) x=1; if(b(12)) y=-1; if(b(13)) y=1;
  if(b(0)) y=-1;
  const prev=gpPrev[slot], cur={p:b(2),k:b(1),s:b(3)||b(5)||b(7),st:b(9)};
  gpPrev[slot]=cur;
  return {x,y,punch:cur.p&&!prev.p,kick:cur.k&&!prev.k,special:cur.s&&!prev.s,start:cur.st&&!prev.st};
}

function step(dt){
  G.t+=dt; G.stateT+=dt;
  updClouds(dt);
  if(G.banner){ G.banner.t+=dt; if(G.banner.t>G.banner.dur) G.banner=null; }
  if(G.hitstop>0){ G.hitstop-=dt; updFx(dt*.3); return; }
  const F=G.fighters;
  if(G.state==='title'||G.state==='select'){
    const A=F[0], B=F[1];
    A.update(dt,demoInput(A,dt),B); B.update(dt,demoInput(B,dt),A); separate(A,B);
    checkBounds(A,false); checkBounds(B,false);
  } else if(G.state==='party'){
    for(const f of F){ f.update(dt,EMPTY,null); if(!f.bubble&&Math.random()<dt*.25) f.bubble={text:pick(['Yay!','Woohoo!','We did it!','Hooray!','Party time!']),t:0,dur:1.4}; }
    if(Math.random()<dt*4) confettiBurst(6);
  } else {
    const live=G.state==='fight';
    for(const f of F){
      const foe=foeOf(f);
      let inp=EMPTY;
      if(f.ctrl==='human'){ const r=readInput(f.pad); if(live) inp=r; }
      else if(f.ctrl==='cpu'&&live) inp=aiThink(f,foe,dt);
      f.update(dt,inp,foe);
    }
    updProjectiles(dt,live);
    if(live){
      for(const a of F) for(const b of F) if(a!==b&&a.team!==b.team) resolveHits(a,b);
      for(let i=0;i<F.length;i++) for(let j=i+1;j<F.length;j++) separate(F[i],F[j]);
      for(const f of F) checkBounds(f,true);
      reviveTick(dt);
      checkEnd();
    } else for(const f of F) checkBounds(f,false);
    if(G.state==='countdown'&&G.stateT>=1.0){ G.state='fight'; G.stateT=0; sfx('fight'); banner('FIGHT!','#ffd84d',84,.8); }
    if(G.state==='ko'){
      const m=G.match, wait=m.mode==='story'&&G.outcome==='win'?4.2:2.0;
      if(!G.winShown&&G.stateT>wait){ G.winShown=true; showEnd(); }
      if(G.winShown&&G.outcome==='win'&&Math.random()<dt*5) confettiBurst(6);
    }
  }
  updFx(dt);
}
function drawShadow(c,f){

}
function drawBeam(c,o,dir,cols,sp,t,chargeT){
  if(sp.phase==='charge'){
    const k=Math.min(1,sp.t/chargeT), r=10+18*k;
    const g=c.createRadialGradient(o.x,o.y,0,o.x,o.y,r); g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(.4,cols[1]); g.addColorStop(1,'rgba(255,255,255,0)');

  }

function flame(c,x,y,s,t,ph){
  const fl=Math.sin(t*20+ph)*.15;
  c.save(); c.translate(x,y); c.scale(s,s*(1+fl));
  c.beginPath(); c.moveTo(0,-18); c.quadraticCurveTo(10,-6,8,4); c.quadraticCurveTo(6,12,0,12); c.quadraticCurveTo(-6,12,-8,4); c.quadraticCurveTo(-10,-6,0,-18);
  c.fillStyle='#ff8a3d'; c.fill(); c.lineWidth=2/s; c.strokeStyle=OUT; c.stroke();
  c.beginPath(); c.moveTo(0,-8); c.quadraticCurveTo(5,0,4,5); c.quadraticCurveTo(0,9,-4,5); c.quadraticCurveTo(-5,0,0,-8); c.fillStyle='#ffd84d'; c.fill();
  c.restore();
}
function outlinedText(c,s,x,y,size,col){
  c.font=size+'px '+TFONT; c.textAlign='center'; c.textBaseline='middle'; c.lineJoin='round';
  c.lineWidth=5; c.strokeStyle=OUT; c.strokeText(s,x,y); c.fillStyle=col; c.fillText(s,x,y);
}
function drawStatusFx(c,f,t){
  if(f.burn){
    for(let i=0;i<3;i++) flame(c,f.x+(i-1)*f.halfW*.75,f.y-f.H*(.3+.28*((i+1)%2)),1+.25*(i%2),t,i*2);
    const hp=headPoint(f); outlinedText(c,'JUMP '+(3-f.burn.jumps)+'!',f.x,hp.y-30,22,'#ffb14a');
  }
  if(f.state==='stunned'){
    const hp=headPoint(f);
    c.save(); c.strokeStyle='rgba(120,200,70,.9)'; c.lineWidth=3; c.lineCap='round';
    for(let i=0;i<3;i++){ const x=f.x+(i-1)*14, off=(t*40+i*12)%36; c.beginPath(); for(let k=0;k<=14;k++){ const y=hp.y-4-off-k*2; const xx=x+Math.sin(k*.8+t*6+i)*3; if(k===0) c.moveTo(xx,y); else c.lineTo(xx,y); } c.stroke(); }
    c.restore();
    outlinedText(c,String(Math.max(1,Math.ceil(f.stunT-f.stateT))),f.x+f.halfW+12,hp.y,22,'#9be07a');
  }
  if(f.cold>0&&isUp(f)){
    const hp=headPoint(f);
    c.fillStyle='#8fdcff';
    for(let i=0;i<4;i++){ const x=f.x+(i-1.5)*12+Math.sin(t*30+i)*2, y=hp.y+6+((t*60+i*9)%26); c.beginPath(); c.arc(x,y,2.4,0,Math.PI*2); c.fill(); }
  }
}
function drawTag(c,f){
  if(!isUp(f)||f.state==='win') return;
  if(f.state==='special'&&f.sp&&INVULN_SPECIALS[f.sp.type]) return;
  let y=f.y-f.H-38; if(f.state==='flattened'||f.state==='knockdown') y=f.y-70;
  if(f.burn||f.state==='stunned') y-=30;
  c.font='16px '+TFONT; c.textAlign='center'; c.textBaseline='middle';
  const w=c.measureText(f.tag).width+14;
  rr(c,f.x-w/2,y-12,w,22,8); fs(c,f.tagColor,2.5);
  c.beginPath(); c.moveTo(f.x-6,y+10); c.lineTo(f.x+6,y+10); c.lineTo(f.x,y+17); c.closePath(); fs(c,f.tagColor,2.5);
  c.fillStyle='#ffffff'; c.fillText(f.tag,f.x,y+1);
}
function drawBubble(c,f){
  const b=f.bubble; if(!b) return;
  const k=Math.min(1,b.t/.15), fade=b.t>b.dur-.25?Math.max(0,(b.dur-b.t)/.25):1;
  const hp=headPoint(f), y=hp.y-34;
  c.save(); c.globalAlpha=fade; c.font='600 19px Fredoka,"Arial Rounded MT Bold",sans-serif';
  const w=c.measureText(b.text).width+26;
  const bx=clamp(f.x,w/2+10,W-w/2-10);
  c.translate(bx,y); c.scale(k,k);
  c.beginPath(); c.moveTo(f.x-bx-9,14); c.lineTo(f.x-bx+9,14); c.lineTo(f.x-bx,30); c.closePath(); fs(c,'#ffffff',3);
  rr(c,-w/2,-18,w,34,14); fs(c,'#ffffff',3);
  c.fillStyle='#ffffff'; c.fillRect(f.x-bx-7,12,14,4);
  c.fillStyle=OUT; c.textAlign='center'; c.textBaseline='middle'; c.fillText(b.text,0,0);
  c.restore();
}
function drawParticles(c){
  for(const p of G.particles){
    c.globalAlpha=Math.max(0,Math.min(1,p.life/p.max*1.4));
    if(p.type==='star'){ starPath(c,p.x,p.y,p.size); c.fillStyle=p.color; c.fill(); c.lineWidth=1.5; c.strokeStyle=OUT; c.stroke(); }
    else if(p.type==='dust'){ const r=p.size*(1+(1-p.life/p.max)*1.5); c.beginPath(); c.arc(p.x,p.y,r,0,Math.PI*2); c.fillStyle=p.color; c.fill(); }
    else if(p.type==='confetti'){ c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.fillStyle=p.color; c.fillRect(-p.size/2,-p.size/4,p.size,p.size/2); c.restore(); }
    else { c.beginPath(); c.arc(p.x,p.y,p.size,0,Math.PI*2); c.fillStyle=p.color; c.fill(); }
  }
  c.globalAlpha=1;
}
function drawTexts(c){
  c.textAlign='center'; c.textBaseline='middle'; c.lineJoin='round';
  for(const tx of G.texts){
    const k=1-tx.life/tx.max, sc=k<.15?.4+k/.15*.8:1.2-(k-.15)*.3;
    c.save(); c.globalAlpha=tx.life<.2?tx.life/.2:1; c.translate(tx.x,tx.y-k*30); c.rotate(tx.rot); c.scale(sc,sc);
    c.font=tx.size+'px '+TFONT; c.lineWidth=7; c.strokeStyle=OUT; c.strokeText(tx.text,0,0); c.fillStyle=tx.col; c.fillText(tx.text,0,0);
    c.restore();
  }
}
function drawBanner(c){
  const b=G.banner; if(!b) return;
  const k=b.t/b.dur, sc=k<.15?.3+k/.15*.9:1.2-Math.min(.2,(k-.15)*.4);
  c.save(); c.globalAlpha=k>.85?(1-k)/.15:1;
  c.font=b.size+'px '+TFONT; c.textAlign='center'; c.textBaseline='middle'; c.lineJoin='round';
  const fit=Math.min(1,900/Math.max(1,c.measureText(b.text).width));
  c.translate(500,190); c.rotate(-.05); c.scale(sc*fit,sc*fit);
  c.lineWidth=12; c.strokeStyle=OUT; c.strokeText(b.text,0,0); c.fillStyle=b.col; c.fillText(b.text,0,0);
  c.restore();
}
function render(){
  const t=G.t, sx=G.shake?rnd(-1,1)*G.shake:0, sy=G.shake?rnd(-1,1)*G.shake:0;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(skyLayer,0,0);
  worldTf(ctx,sx*.3,sy*.3); drawClouds(ctx);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(stageLayer,Math.round(DPR*sx),Math.round(DPR*sy));
  worldTf(ctx,sx,sy);
  const F=G.fighters;
  for(const f of F) drawShadow(ctx,f);
  for(const f of F) drawAura(ctx,f);
  const order=F.slice().sort((a,b)=>(a.state==='special'?1:0)-(b.state==='special'?1:0)||(a.scale||1)-(b.scale||1));
  for(const f of order) drawFighter(ctx,f,t);
  for(const f of F){
    if(f.state==='special'&&f.sp){
      const st=f.sp.type;
      if(st==='laser'||st==='mouthLaser') drawBeam(ctx,laserOrigin(f),f.facing,f.def.beam||DEFAULT_BEAM,f.sp,t,.45);
      else if(st==='fart'){ const o=fartOrigin(f); drawBeam(ctx,o,o.dir,FART_BEAM,f.sp,t,.5); }
      else if(st==='spin'||st==='dunk') drawLeapFx(ctx,f);
      else if(st==='stretch'&&f.sp.phase==='squeeze') drawWrap(ctx,f);
      else if(st==='mind') drawMindFx(ctx,f,t);
      else if(st==='golf') drawGolfFx(ctx,f);
    }
    if(f.state==='dead'||(f.state==='freeing'&&f.stateT<1.3)){ const h=headPoint(f); drawStars(ctx,h.x,h.y,t); }
    if(f.state==='flattened') drawStars(ctx,f.x,f.y-42,t);
    drawStatusFx(ctx,f,t);
  }
  drawProjectiles(ctx,t);
  drawParticles(ctx); drawTexts(ctx);
  if(G.state==='countdown'||G.state==='fight') for(const f of F) drawTag(ctx,f);
  if(G.state==='fight'){
    for(const f of F) if(f.state==='dead'&&f.reviveT>0){ const h=headPoint(f); outlinedText(ctx,'Back in '+Math.ceil(f.reviveT),f.x,h.y-26,22,'#7dffa0'); }
  }
  for(const f of F) drawBubble(ctx,f);
  drawBanner(ctx);
}
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(!(dt>0)) dt=0; if(dt>.05) dt=.05;
  if(!G.paused&&dt>0){ const n=Math.max(1,Math.ceil(dt/(1/60))), h=dt/n; for(let i=0;i<n;i++) step(h); }
  updateHud();
  render();
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
Progress.load();
initClouds();
makeDemo();
updateSoundIcons();
document.documentElement.style.setProperty('--page-bg',ARENAS[G.arena].bg);
resize();
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));
if(window.ResizeObserver) new ResizeObserver(()=>resize()).observe(document.body);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(G.state==='select') renderSelect(); });
requestAnimationFrame(frame);
Progress.connect();

})();
</script>
